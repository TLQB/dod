<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel File Upload</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e0f7fa;
            font-family: Arial, sans-serif;
        }

        .upload-container {
            background-color: #ffffff;
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .upload-container:hover {
            background-color: #f1f1f1;
        }

        .upload-icon {
            font-size: 50px;
            color: #007bff;
        }

        .upload-text {
            font-size: 18px;
            color: #007bff;
            margin-top: 10px;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-item .file-name {
            font-size: 16px;
            color: #333;
        }

        .file-item .file-status {
            font-size: 14px;
            color: #007bff;
        }

        .file-item .file-progress {
            width: 100%;
            height: 5px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .file-item .file-progress .progress-bar {
            height: 100%;
            background-color: #007bff;
        }

        .file-item .file-size {
            font-size: 14px;
            color: #666;
        }

        .file-item .file-icon {
            font-size: 24px;
            color: #007bff;
        }

        .form-label {
            text-align: left;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Update Discount Rate</h1>
        <!-- Upload Form -->
        <div class="upload-container">
            <form method="post" enctype="multipart/form-data" id="uploadForm">
                {% csrf_token %}
                <div class="upload-icon">
                    <i class="bi bi-cloud-upload"></i>
                </div>
                <div class="upload-text">Browse file to upload</div>
                <!-- File Upload Input 1 -->
                <div class="mb-3 text-start">
                    <label for="fileData" class="form-label">Choose file data:</label>
                    <input class="form-control" type="file" id="fileData" name="input_filename" accept=".xls, .xlsx">
                </div>
                <!-- File Upload Input 2 -->
                <div class="mb-3 text-start">
                    <label for="fileUpdate" class="form-label">Select the file to be updated:</label>
                    <input class="form-control" type="file" id="fileUpdate" name="output_filename" accept=".xls, .xlsx">
                </div>
                <!-- Submit Button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" id="submitButton" disabled>Get File
                        Update</button>
                </div>
            </form>
        </div>
        <div class="file-list" id="fileList" style="display: none;">
            <div class="file-item" id="fileItem1">
                <div>
                    <div class="file-name" id="fileName1">File 1</div>
                    <div class="file-status" id="fileStatus1">Uploading</div>
                    <div class="file-progress">
                        <div class="progress-bar" id="fileProgress1" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="file-size" id="fileSize1">0%</div>
            </div>
            <div class="file-item" id="fileItem2">
                <div>
                    <div class="file-name" id="fileName2">File 2</div>
                    <div class="file-status" id="fileStatus2">Uploading</div>
                    <div class="file-progress">
                        <div class="progress-bar" id="fileProgress2" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="file-size" id="fileSize2">0%</div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script>
        function checkFiles() {
            const fileData = document.getElementById('fileData').files.length > 0;
            const fileUpdate = document.getElementById('fileUpdate').files.length > 0;
            document.getElementById('submitButton').disabled = !(fileData && fileUpdate);
        }

        document.getElementById('fileData').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileList').style.display = 'block';
                document.getElementById('fileName1').textContent = file.name;
                document.getElementById('fileStatus1').textContent = 'Uploading';
                document.getElementById('fileProgress1').style.width = '100%';
                document.getElementById('fileSize1').textContent = '100%';
                document.getElementById('fileStatus1').textContent = 'Uploaded';
            }
            checkFiles();
        });

        document.getElementById('fileUpdate').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileList').style.display = 'block';
                document.getElementById('fileName2').textContent = file.name;
                document.getElementById('fileStatus2').textContent = 'Uploading';
                document.getElementById('fileProgress2').style.width = '100%';
                document.getElementById('fileSize2').textContent = '100%';
                document.getElementById('fileStatus2').textContent = 'Uploaded';
            }
            checkFiles();
        });
    </script>
</body>

</html>
